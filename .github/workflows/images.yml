name: images

# S21: build the three images (collector, api, overview), run the compose suite (images, Compose file, isolation test
# against the running production project) on the runner's stock Docker Engine, and push to GHCR from pushes only.
# Deployment stays manual.
# The v<version> tag that compose.yaml pins exists in GHCR only after a pushed tag v<version> whose push job succeeded.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # uv fails instead of updating uv.lock when it is out of date.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # The isolation test reads the engine's rules with passwordless sudo, which the runner provides.
      - run: make compose-test

  push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches project.version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project.version ${version}" >&2
            exit 1
          fi
      - run: make images
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Tag and push
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="${GITHUB_REF_NAME} sha-${GITHUB_SHA}"; else tags="main sha-${GITHUB_SHA}"; fi
          for name in collector api overview; do
            for tag in ${tags}; do
              docker tag "quasar-market-data-${name}:local" "ghcr.io/drdoom2012/quasar-market-data-${name}:${tag}"
              docker push "ghcr.io/drdoom2012/quasar-market-data-${name}:${tag}"
            done
          done
