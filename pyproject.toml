[project]
name = "quasar-market-data"
version = "0.1.0"
description = "Independent Python market data service for Quasar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.89",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "ta-lib>=0.8.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
quasar-collector = "quasar_market_data.collector.cli:main"
quasar-api = "quasar_market_data.api.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar_market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live and not compose and not simulation'"
markers = [
    "live: tests that hit a live exchange (excluded by default)",
    "compose: tests that need a Docker engine (excluded by default)",
    "simulation: long capacity simulations of the funding rate task (excluded by default; `make simulate`)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true  # ccxt ships no py.typed

[tool.importlinter]
root_package = "quasar_market_data"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["quasar_market_data.domain"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "quasar_market_data.storage",
    "quasar_market_data.config",
    "ccxt",
    "fastapi",
    "talib",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "config depends only on domain and the standard library"
type = "forbidden"
source_modules = ["quasar_market_data.config"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "quasar_market_data.storage",
    "ccxt",
    "fastapi",
    "talib",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "collector and api are independent"
type = "independence"
modules = ["quasar_market_data.collector", "quasar_market_data.api"]

[[tool.importlinter.contracts]]
name = "storage is a leaf below collector and api"
type = "forbidden"
source_modules = ["quasar_market_data.storage"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "ccxt",
    "fastapi",
    "talib",
]

[[tool.importlinter.contracts]]
name = "only the collector migrates"
type = "forbidden"
source_modules = ["quasar_market_data.api"]
forbidden_modules = ["quasar_market_data.storage.migrate"]

[[tool.importlinter.contracts]]
name = "ccxt is imported only by the Binance adapter"
type = "forbidden"
source_modules = ["quasar_market_data.api", "quasar_market_data.collector"]
forbidden_modules = ["ccxt"]
ignore_imports = [
    "quasar_market_data.collector.binance_usdm -> ccxt",
    "quasar_market_data.collector.binance_usdm_open_interest -> ccxt",
    "quasar_market_data.collector.binance_usdm_funding_rate -> ccxt",
]

[[tool.importlinter.contracts]]
name = "open interest is independent of candle limiter and time"
type = "forbidden"
source_modules = [
    "quasar_market_data.collector.binance_usdm_open_interest",
    "quasar_market_data.collector.open_interest_budget",
    "quasar_market_data.collector.fetch_open_interest_once",
    "quasar_market_data.collector.open_interest_reader",
    "quasar_market_data.collector.open_interest_measurements",
    "quasar_market_data.collector.open_interest_task",
]
forbidden_modules = [
    "quasar_market_data.collector.rate_limiter",
    "quasar_market_data.collector.shared_server_time",
]

[[tool.importlinter.contracts]]
name = "open interest does not use funding rate modules"
type = "forbidden"
# Direct imports only (indirect ones are allowed): both datasets legitimately reach the shared extension_pause, which
# the next contract fences from the funding side. Amendment A-3 to ADR-0003.
allow_indirect_imports = true
source_modules = [
    "quasar_market_data.collector.binance_usdm_open_interest",
    "quasar_market_data.collector.binance_open_interest",
    "quasar_market_data.collector.open_interest_budget",
    "quasar_market_data.collector.open_interest_task",
    "quasar_market_data.collector.open_interest_measurements",
    "quasar_market_data.collector.open_interest_reader",
    "quasar_market_data.collector.open_interest_writer",
    "quasar_market_data.collector.async_open_interest_writer",
    "quasar_market_data.collector.fetch_open_interest_once",
]
forbidden_modules = [
    "quasar_market_data.collector.binance_usdm_funding_rate",
    "quasar_market_data.collector.binance_funding_rate",
    "quasar_market_data.collector.funding_rate_limiter",
    "quasar_market_data.collector.funding_rate_writer",
    "quasar_market_data.collector.async_funding_rate_writer",
    "quasar_market_data.collector.funding_rate_reader",
    "quasar_market_data.collector.funding_rate_execution",
    "quasar_market_data.collector.funding_rate_measurements",
    "quasar_market_data.collector.funding_rate_task",
    "quasar_market_data.collector.fetch_funding_rate_once",
]

[[tool.importlinter.contracts]]
name = "extension pause does not use funding rate modules"
type = "forbidden"
# The one object the two extension datasets share must stay a leaf: it may not reach a funding module here, and the
# funding contract below fences it from open interest modules (A-3, ADR-0004 P-9).
source_modules = ["quasar_market_data.collector.extension_pause"]
forbidden_modules = [
    "quasar_market_data.collector.binance_usdm_funding_rate",
    "quasar_market_data.collector.binance_funding_rate",
    "quasar_market_data.collector.funding_rate_limiter",
    "quasar_market_data.collector.funding_rate_writer",
    "quasar_market_data.collector.async_funding_rate_writer",
    "quasar_market_data.collector.funding_rate_reader",
    "quasar_market_data.collector.funding_rate_execution",
    "quasar_market_data.collector.funding_rate_measurements",
    "quasar_market_data.collector.funding_rate_task",
    "quasar_market_data.collector.fetch_funding_rate_once",
]

[[tool.importlinter.contracts]]
name = "funding rate is independent of candle limiter, time and open interest"
type = "forbidden"
source_modules = [
    "quasar_market_data.collector.binance_usdm_funding_rate",
    "quasar_market_data.collector.funding_rate_limiter",
    "quasar_market_data.collector.extension_pause",
    "quasar_market_data.collector.fetch_funding_rate_once",
    "quasar_market_data.collector.funding_rate_reader",
    "quasar_market_data.collector.funding_rate_execution",
    "quasar_market_data.collector.funding_rate_measurements",
    "quasar_market_data.collector.funding_rate_task",
]
forbidden_modules = [
    "quasar_market_data.collector.rate_limiter",
    "quasar_market_data.collector.shared_server_time",
    "quasar_market_data.collector.collection_loop",
    "quasar_market_data.collector.binance_usdm_open_interest",
    "quasar_market_data.collector.binance_open_interest",
    "quasar_market_data.collector.open_interest_budget",
    "quasar_market_data.collector.open_interest_task",
    "quasar_market_data.collector.open_interest_measurements",
    "quasar_market_data.collector.open_interest_reader",
    "quasar_market_data.collector.open_interest_writer",
    "quasar_market_data.collector.async_open_interest_writer",
    "quasar_market_data.collector.fetch_open_interest_once",
]

[[tool.importlinter.contracts]]
name = "candle collection does not use extension datasets"
type = "forbidden"
source_modules = [
    "quasar_market_data.collector.collection_loop",
    "quasar_market_data.collector.fetch_once",
    "quasar_market_data.collector.binance_usdm",
    "quasar_market_data.collector.rate_limiter",
    "quasar_market_data.collector.shared_server_time",
    "quasar_market_data.collector.candle_writer",
    "quasar_market_data.collector.async_candle_writer",
    "quasar_market_data.collector.backfill",
    "quasar_market_data.collector.deadline_source",
    "quasar_market_data.collector.binance_klines",
    "quasar_market_data.collector.kline_source",
    "quasar_market_data.collector.clock_lead",
    "quasar_market_data.collector.hole_reader",
    "quasar_market_data.collector.reconcile_reader",
    "quasar_market_data.collector.candle_write_activity",
]
forbidden_modules = [
    "quasar_market_data.collector.extension_pause",
    "quasar_market_data.collector.binance_usdm_funding_rate",
    "quasar_market_data.collector.funding_rate_limiter",
    "quasar_market_data.collector.fetch_funding_rate_once",
    "quasar_market_data.collector.binance_funding_rate",
    "quasar_market_data.collector.funding_rate_writer",
    "quasar_market_data.collector.async_funding_rate_writer",
    "quasar_market_data.collector.funding_rate_reader",
    "quasar_market_data.collector.funding_rate_execution",
    "quasar_market_data.collector.funding_rate_measurements",
    "quasar_market_data.collector.funding_rate_task",
]

[[tool.importlinter.contracts]]
name = "api reaches no network client"
type = "forbidden"
source_modules = ["quasar_market_data.api"]
forbidden_modules = ["httpx", "requests", "aiohttp", "websockets", "socket", "ssl"]

[[tool.importlinter.contracts]]
name = "talib and numpy are imported only by the indicator engine"
type = "forbidden"
source_modules = [
    "quasar_market_data.api",
    "quasar_market_data.collector",
    "quasar_market_data.storage",
]
forbidden_modules = ["talib", "numpy"]
ignore_imports = [
    "quasar_market_data.api.indicator_engine -> talib",
    "quasar_market_data.api.indicator_engine -> numpy",
]
