[project]
name = "quasar-market-data"
version = "0.1.0"
description = "Independent Python market data service for Quasar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ccxt>=4.5.89"]

[project.scripts]
quasar-collector = "quasar_market_data.collector.cli:main"
quasar-api = "quasar_market_data.api.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar_market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: tests that hit a live exchange (excluded by default)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true  # ccxt ships no py.typed

[tool.importlinter]
root_package = "quasar_market_data"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["quasar_market_data.domain"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "quasar_market_data.storage",
    "ccxt",
    "fastapi",
    "talib",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "collector and api are independent"
type = "independence"
modules = ["quasar_market_data.collector", "quasar_market_data.api"]

[[tool.importlinter.contracts]]
name = "storage is a leaf below collector and api"
type = "forbidden"
source_modules = ["quasar_market_data.storage"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "ccxt",
    "fastapi",
    "talib",
]

[[tool.importlinter.contracts]]
name = "only the collector migrates"
type = "forbidden"
source_modules = ["quasar_market_data.api"]
forbidden_modules = ["quasar_market_data.storage.migrate"]

[[tool.importlinter.contracts]]
name = "ccxt is imported only by the Binance adapter"
type = "forbidden"
source_modules = ["quasar_market_data.api", "quasar_market_data.collector"]
forbidden_modules = ["ccxt"]
ignore_imports = ["quasar_market_data.collector.binance_usdm -> ccxt"]
