[project]
name = "quasar-market-data"
version = "0.1.0"
description = "Independent Python market data service for Quasar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.89",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "ta-lib>=0.8.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
quasar-collector = "quasar_market_data.collector.cli:main"
quasar-api = "quasar_market_data.api.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar_market_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live and not compose'"
markers = [
    "live: tests that hit a live exchange (excluded by default)",
    "compose: tests that need a Docker engine (excluded by default)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["tools"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true  # ccxt ships no py.typed

[tool.importlinter]
root_package = "quasar_market_data"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["quasar_market_data.domain"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "quasar_market_data.storage",
    "quasar_market_data.config",
    "ccxt",
    "fastapi",
    "talib",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "config depends only on domain and the standard library"
type = "forbidden"
source_modules = ["quasar_market_data.config"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "quasar_market_data.storage",
    "ccxt",
    "fastapi",
    "talib",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "collector and api are independent"
type = "independence"
modules = ["quasar_market_data.collector", "quasar_market_data.api"]

[[tool.importlinter.contracts]]
name = "storage is a leaf below collector and api"
type = "forbidden"
source_modules = ["quasar_market_data.storage"]
forbidden_modules = [
    "quasar_market_data.collector",
    "quasar_market_data.api",
    "ccxt",
    "fastapi",
    "talib",
]

[[tool.importlinter.contracts]]
name = "only the collector migrates"
type = "forbidden"
source_modules = ["quasar_market_data.api"]
forbidden_modules = ["quasar_market_data.storage.migrate"]

[[tool.importlinter.contracts]]
name = "ccxt is imported only by the Binance adapter"
type = "forbidden"
source_modules = ["quasar_market_data.api", "quasar_market_data.collector"]
forbidden_modules = ["ccxt"]
ignore_imports = [
    "quasar_market_data.collector.binance_usdm -> ccxt",
    "quasar_market_data.collector.binance_usdm_open_interest -> ccxt",
]

[[tool.importlinter.contracts]]
name = "open interest is independent of candle limiter and time"
type = "forbidden"
source_modules = [
    "quasar_market_data.collector.binance_usdm_open_interest",
    "quasar_market_data.collector.open_interest_budget",
    "quasar_market_data.collector.open_interest_gate",
]
forbidden_modules = [
    "quasar_market_data.collector.rate_limiter",
    "quasar_market_data.collector.shared_server_time",
]

[[tool.importlinter.contracts]]
name = "api reaches no network client"
type = "forbidden"
source_modules = ["quasar_market_data.api"]
forbidden_modules = ["httpx", "requests", "aiohttp", "websockets", "socket", "ssl"]

[[tool.importlinter.contracts]]
name = "talib and numpy are imported only by the indicator engine"
type = "forbidden"
source_modules = [
    "quasar_market_data.api",
    "quasar_market_data.collector",
    "quasar_market_data.storage",
]
forbidden_modules = ["talib", "numpy"]
ignore_imports = [
    "quasar_market_data.api.indicator_engine -> talib",
    "quasar_market_data.api.indicator_engine -> numpy",
]
