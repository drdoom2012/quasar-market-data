<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbol overview</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --line: #d8d8dc; --card: #ffffff;
    --ok: #2e7d4f; --warn: #b26a00; --bad: #b3261e; --none: #6b6b70;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #ececf0; --muted: #9a9aa2; --line: #36363b; --card: #1f1f22;
            --ok: #5cc98a; --warn: #e0a040; --bad: #ff7b72; --none: #9a9aa2; }
  }
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 20px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  #status-line { color: var(--muted); }
  #status-line.old { color: var(--warn); font-weight: 600; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #api-error { display: none; border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-weight: 600; }
  #summary { display: flex; flex-wrap: wrap; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; min-width: 90px; }
  .tile b { display: block; font-size: 22px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  th, td { text-align: left; padding: 5px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; border-top: 0; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
  .s-ok { color: var(--ok); } .s-behind, .s-holes, .s-unverified, .s-partly_verified { color: var(--warn); } .s-stale, .s-conflict, .s-unknown, .s-quiet { color: var(--bad); } .s-no_data { color: var(--none); }
  canvas { width: 100%; min-width: 360px; height: 14px; display: block; border-radius: 2px; }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; font-size: 12px; color: var(--muted); }
  #legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
  .muted { color: var(--muted); }
  .tilerow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .tilerow-label { align-self: center; min-width: 110px; font-weight: 600; color: var(--muted); }
  .notice { color: var(--warn); font-weight: 600; margin: 4px 0; }
  .strip-label { font-size: 11px; color: var(--muted); margin: 2px 0 1px; }
  .note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Symbol overview</h1>
  <button id="refresh" type="button">Refresh</button>
  <span id="status-line" role="status"></span>
</header>
<div id="api-error" role="alert"></div>
<div id="summary"></div>
<div id="oi-summary"></div>
<div id="oi-notice" class="notice" role="status"></div>
<div id="funding-summary"></div>
<div id="funding-health" class="note"></div>
<div id="funding-notice" class="notice" role="status"></div>
<div id="refresh-notice" class="notice" role="status"></div>
<h2 id="problems-title">What is wrong</h2>
<table id="problems"></table>
<details id="ok-group"></details>
<h2>Last 30 days</h2>
<div id="legend"></div>
<table id="heatmap"></table>

<script>
"use strict";
// All text of the page is here. The page decides no state: it draws what /overview.json says. The decisions it does
// make (which symbols are listed, in which order, what is in the ok group) are the pure functions above the marker.
const TEXT = {
  down: "The tool does not respond: ",
  apiNotReady: "The API is not usable: ",
  never: "nothing yet",
  age: (s) => `state from the API, fetched ${s} s ago`,
  states: { no_data: "no data", unknown: "cannot judge", stale: "stale", conflict: "conflict", holes: "holes", behind: "behind", ok: "ok",
    quiet: "quiet", unverified: "not verified", partly_verified: "partly verified" },
  tiles: { total: "total" },
  rows: { candles: "Candles", openInterest: "Open interest", funding: "Funding rate" },
  noProblems: "Nothing is wrong.",
  okGroup: (n, label) => `${n} ${plural(n, "symbol", "symbols")} ok ${label}`,
  columns: { candles: "Candles", openInterest: "Open interest", funding: "Funding rate", symbol: "Symbol", why: "Reason", since: "History since", strips: "30 days" },
  notApplicable: "–",
  prefix: { candles: "candles: ", openInterest: "open interest: ", funding: "funding: " },
  reasons: {
    no_data: () => "nothing downloaded (the API cannot tell whether something should have been)",
    invalid: (r) => `the API answer cannot be used (${r.detail})`,
    stored_ahead: () => "the server clock is ahead of the stored data, freshness cannot be judged",
    stale: (r, s) => `${slots(r.slots)} overdue, last candle ${fmt(s.newest_open_time_ms)}`,
    conflict: (r) => `${slots(r.slots)} in conflict`,
    missing: (r) => `${slots(r.slots)} missing (runs: ${r.runs})`,
    unavailable: (r) => `${slots(r.slots)}: the exchange confirmed it has no data`,
    due: (r) => `behind by ${slots(r.slots)}`,
  },
  oiReasons: {
    no_data: () => "no open interest stored (the API cannot tell whether some should have been)",
    invalid: (r) => `the API answer cannot be used (${r.detail})`,
    stale: (r, b) => `${slots(r.slots)} overdue, last row ${fmt(b.newest_time_ms)}`,
    conflict: (r) => `${slots(r.slots)} in conflict`,
    missing: (r) => `${slots(r.slots)} without a row (runs: ${r.runs}); Binance omits periods without trades and the API cannot tell that from a lost row`,
    due: (r) => `behind by ${slots(r.slots)}`,
    unrecoverable: (r, b) => `${slots(r.slots)} inside the stored history have no row and are older than the retrieval horizon (${days(b.retrieval_horizon_ms)} days), so they can no longer be fetched`,
  },
  fundingReasons: {
    no_data: () => "no funding settlement and no verified span stored (the API cannot tell whether some should have been)",
    invalid: (r) => `the API answer cannot be used (${r.detail})`,
    conflict: (r) => `${r.slots} ${plural(r.slots, "settlement", "settlements")} in conflict in the window: the stored value may be the wrong one`,
    quiet: (r, b, i) => (b.newest_funding_time_ms == null
      ? "no settlement stored (normal for a listing that has not had its first settlement, or a wrong symbol)"
      : `newest settlement ${fmt(b.newest_funding_time_ms)}, more than ${hours(i && i.rule && i.rule.quiet_after_ms)} ago; this does not say the symbol stopped`),
    behind: (r, b, i) => `the verified span ends ${fmt(b.verified_through_ms)}, more than ${hours(i && i.rule && i.rule.behind_after_ms)} before the API clock; the cause (stopped task, pause, outage) is not visible to the API`,
    unverified: () => "the Collector has not verified this window; this does not say settlements are missing, and not that none occurred",
    partly_verified: (r, b, i) => `verified from ${fmt(b.verified_from_ms)}${i && i.window ? `, the window starts ${fmt(i.window.start)}` : ""}: the older part is not verified yet; this does not say settlements are missing`,
  },
  fundingMissing: "no funding answer for this symbol",
  fundingDisabled: "Funding rate is not enabled in this deployment",
  fundingAbsent: "Funding rate is not reported by the tool",
  fundingUnknown: (detail) => `Funding rate could not be judged for any symbol (${detail}); every symbol is listed as a problem because nothing says it is fine`,
  fundingClamped: (days) => `Funding rate is judged over the last ${days} ${plural(days, "day", "days")} only: that is as deep as the Collector is configured to verify`,
  fundingHealth: (h) => `Funding rate, the API's own figures over all stored series (not only these symbols): status ${h.status}, ${h.behind} behind, ${h.catching_up} catching up, ${h.quiet_series} quiet, ${h.conflicted_series} with a conflict in the last 24 hours`,
  fundingLine: {
    cannot: "funding: cannot judge",
    none: "funding: nothing stored",
    state: (b, w) => `funding: verified ${b.verified_from_ms == null ? "nothing" : `${day(b.verified_from_ms)} to ${fmt(b.verified_through_ms)}`} · newest settlement ${fmt(b.newest_funding_time_ms)} · ${b.events_in_window} ${plural(b.events_in_window, "settlement", "settlements")}${w ? ` from ${day(w.start)} to ${fmt(w.end)}` : ""} · ${b.complete ? "complete as far as the Collector verified" : "not complete"}`,
  },
  oiMissing: "no open interest answer for this symbol",
  oiDisabled: "Open interest is not enabled in this deployment",
  oiAbsent: "Open interest is not reported by the tool",
  oiUnknown: (detail) => `Open interest could not be judged for any symbol (${detail}); every symbol is listed as a problem because nothing says it is fine`,
  groupParts: { candles: "candles", openInterest: "open interest", funding: "funding" },
  deadline: {
    candles: (n) => `Candles: the refresh hit its time limit; ${n == null ? "some symbols were" : `${n} ${plural(n, "symbol", "symbols")} ${plural(n, "was", "were")}`} not asked`,
    openInterest: (n) => `Open interest: the refresh hit its time limit; ${n == null ? "some symbols were" : `${n} ${plural(n, "symbol", "symbols")} ${plural(n, "was", "were")}`} not asked`,
    funding: (n) => `Funding rate: the refresh hit its time limit; ${n == null ? "some symbols were" : `${n} ${plural(n, "symbol", "symbols")} ${plural(n, "was", "were")}`} not asked`,
  },
  legend: { candles: "Candles", openInterest: "Open interest" },
  noStripFunding: "Funding has no time grid, so it has no strip: the line under the strips says what the Collector verified.",
  strip: { "_": "no history yet", ".": "ok", n: "not expected yet", d: "behind", u: "exchange has no data", m: "hole", c: "conflict", s: "stale" },
  oiStrip: { "_": "before the first stored row", ".": "ok", r: "no longer recoverable", n: "not expected yet", d: "behind", m: "hole", c: "conflict", s: "stale" },
  stripNone: "cannot judge",
  since: { candles: "candles", openInterest: "first stored row" },
};
// English plural: 1 -> one, otherwise many.
const plural = (n, one, many) => (n === 1 ? one : many);
const slots = (n) => `${n} ${plural(n, "slot", "slots")}`;
const days = (ms) => Math.round(ms / 86400000);
const hours = (ms) => (ms == null ? "the API's threshold" : `${Math.round(ms / 360000) / 10} h`);
const ORDER = ["no_data", "unknown", "stale", "conflict", "holes", "behind", "ok"];
// The states of the funding part (design 4.3) and the one rank over all three parts: the worst state of any part decides the order of the list.
const FUNDING_ORDER = ["no_data", "unknown", "conflict", "quiet", "behind", "unverified", "partly_verified", "ok"];
const RANK_ORDER = ["no_data", "unknown", "stale", "conflict", "quiet", "holes", "behind", "unverified", "partly_verified", "ok"];
const COLORS = { "_": "#c9c9cf", ".": "#2e9d62", n: "#9ec5ee", d: "#f0b429", u: "#8e5bd0", r: "#9c6b30", m: "#e0443a", c: "#c2186b", s: "#7a0f0f" };
const POLL_MS = 60000, OLD_AFTER_S = 180;

function fmt(ms) { return ms == null ? "–" : new Date(ms).toISOString().slice(0, 16).replace("T", " ") + " UTC"; }
function day(ms) { return ms == null ? "–" : new Date(ms).toISOString().slice(0, 10); }

// The status of the open interest part: "disabled", "unknown", "enabled", or "absent" (a tool that does not report it).
function oiStatus(data) { return data.open_interest ? data.open_interest.status : "absent"; }
function applies(status) { return status !== "disabled" && status !== "absent"; }
// A symbol's open interest state, or null when it does not apply. Never green without an answer: when open interest
// applies and a symbol has no block, nothing says it is fine.
function oiStateOf(s, status) {
  if (!applies(status)) return null;
  return s.open_interest ? s.open_interest.state : "unknown";
}
// The status of the funding part: "disabled", "unknown", "enabled", or "absent" (a tool that does not report it).
// Every function below takes it as an OPTIONAL last parameter; "absent" gives exactly the output of a page without funding.
function fundingStatus(data) { return data.funding_rate ? data.funding_rate.status : "absent"; }
function fundingStateOf(s, fstatus = "absent") {
  if (!applies(fstatus)) return null;
  return s.funding_rate ? s.funding_rate.state : "unknown";
}
function rank(state) { return RANK_ORDER.indexOf(state); }
function worstRank(s, status, fstatus = "absent") {
  const states = [s.state, oiStateOf(s, status), fundingStateOf(s, fstatus)].filter((x) => x !== null);
  return Math.min(...states.map(rank));
}
function isProblem(s, status, fstatus = "absent") {
  return [s.state, oiStateOf(s, status), fundingStateOf(s, fstatus)].some((x) => x !== null && x !== "ok");
}
// Listed when the candle, the open interest OR the funding state is a problem; the worst of them first, then the candle state.
function problemSymbols(symbols, status, fstatus = "absent") {
  return symbols.filter((s) => isProblem(s, status, fstatus))
    .sort((a, b) => worstRank(a, status, fstatus) - worstRank(b, status, fstatus) || rank(a.state) - rank(b.state) || a.symbol.localeCompare(b.symbol));
}
function reasonText(r, s) { return (TEXT.reasons[r.code] || (() => r.code))(r, s); }
function oiReasonText(r, block) { return (TEXT.oiReasons[r.code] || (() => r.code))(r, block); }
function fundingReasonText(r, block, info) { return (TEXT.fundingReasons[r.code] || (() => r.code))(r, block, info); }
// `finfo` is the top-level funding block (the rule and the window the texts quote); optional.
function reasonLines(s, status, fstatus = "absent", finfo = null) {
  const lines = s.reasons.map((r) => TEXT.prefix.candles + reasonText(r, s));
  if (applies(status)) {
    if (s.open_interest) lines.push(...s.open_interest.reasons.map((r) => TEXT.prefix.openInterest + oiReasonText(r, s.open_interest)));
    else lines.push(TEXT.prefix.openInterest + TEXT.oiMissing);
  }
  if (applies(fstatus)) {
    if (s.funding_rate) lines.push(...s.funding_rate.reasons.map((r) => TEXT.prefix.funding + fundingReasonText(r, s.funding_rate, finfo)));
    else lines.push(TEXT.prefix.funding + TEXT.fundingMissing);
  }
  return lines;
}
// Symbols where both parts are ok, each with the information line `unrecoverable` when it has one (option C).
function okEntries(symbols, status, fstatus = "absent") {
  return symbols.filter((s) => !isProblem(s, status, fstatus)).map((s) => {
    const block = s.open_interest;
    const found = block ? block.reasons.find((r) => r.code === "unrecoverable") : undefined;
    return { symbol: s.symbol, note: found ? oiReasonText(found, block) : "" };
  });
}
// "(candles)", "(candles and open interest)", "(candles, open interest and funding)": the parts the group is ok in.
function okGroupLabel(status, fstatus = "absent") {
  const parts = [TEXT.groupParts.candles];
  if (applies(status)) parts.push(TEXT.groupParts.openInterest);
  if (applies(fstatus)) parts.push(TEXT.groupParts.funding);
  return "(" + (parts.length === 1 ? parts[0] : parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1]) + ")";
}
function fundingNotice(fstatus, detail, block) {
  if (fstatus === "enabled") {
    const w = block && block.window;
    return w && w.clamped && block.rule ? TEXT.fundingClamped(block.rule.backfill_days) : null;
  }
  if (fstatus === "disabled") return TEXT.fundingDisabled;
  if (fstatus === "unknown") return TEXT.fundingUnknown(detail);
  return TEXT.fundingAbsent;
}
// The line under a symbol's strips: what the Collector verified, in words; never a color that could mean "fine".
function fundingLine(block, info) {
  if (!block) return TEXT.fundingLine.cannot;
  if (block.state === "unknown") return TEXT.fundingLine.cannot;
  if (block.state === "no_data") return TEXT.fundingLine.none;
  return TEXT.fundingLine.state(block, info && info.window);
}
function oiNotice(status, detail) {
  if (status === "enabled") return null;
  if (status === "disabled") return TEXT.oiDisabled;
  if (status === "unknown") return TEXT.oiUnknown(detail);
  return TEXT.oiAbsent;
}
function refreshNotices(refresh) {
  const lines = [];
  if (refresh.deadline_hit) lines.push(TEXT.deadline.candles(refresh.candle_not_asked));
  if (refresh.oi_deadline_hit) lines.push(TEXT.deadline.openInterest(refresh.oi_not_asked));
  if (refresh.funding_deadline_hit) lines.push(TEXT.deadline.funding(refresh.funding_not_asked));
  return lines;
}

// --- DOM below ---

const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  for (const c of children) node.append(c);
  return node;
}

function legend() {
  const box = $("legend");
  box.replaceChildren();
  for (const [title, texts] of [[TEXT.legend.candles, TEXT.strip], [TEXT.legend.openInterest, TEXT.oiStrip]]) {
    box.append(el("b", {}, title + ":"));
    for (const [ch, text] of Object.entries(texts)) {
      const swatch = el("i"); swatch.style.background = COLORS[ch];
      box.append(el("span", {}, swatch, text));
    }
  }
}

function tag(state) { return el("span", { class: `tag s-${state}` }, TEXT.states[state]); }

function drawStrip(canvas, strip, window_, texts) {
  canvas.width = 720; canvas.height = 14;
  const ctx = canvas.getContext("2d");
  if (strip == null) {  // cannot be judged: hatched, never a color that means fine
    ctx.fillStyle = "#8884"; ctx.fillRect(0, 0, 720, 14);
    ctx.strokeStyle = "#888"; ctx.lineWidth = 1;
    for (let x = -14; x < 720; x += 6) { ctx.beginPath(); ctx.moveTo(x, 14); ctx.lineTo(x + 14, 0); ctx.stroke(); }
    canvas.title = TEXT.stripNone;
    return;
  }
  for (let i = 0; i < strip.length;) {
    let j = i; while (j < strip.length && strip[j] === strip[i]) j++;
    ctx.fillStyle = COLORS[strip[i]] || "#000"; ctx.fillRect(i, 0, j - i, 14);
    i = j;
  }
  // Bucket k is the same hour in both strips (an open interest slot is the END of its period).
  const bucketMs = window_.bucket_slots * 300000;
  canvas.onmousemove = (event) => {
    const i = Math.min(strip.length - 1, Math.max(0, Math.floor(event.offsetX / canvas.getBoundingClientRect().width * strip.length)));
    const from = window_.start + i * bucketMs;
    canvas.title = `${fmt(from)} – ${fmt(from + bucketMs)}: ${texts[strip[i]] || strip[i]}`;
  };
}

function clearStates() {
  for (const id of ["summary", "oi-summary", "oi-notice", "funding-summary", "funding-health", "funding-notice", "refresh-notice", "problems", "heatmap"]) $(id).replaceChildren();
  $("ok-group").replaceChildren(); $("ok-group").style.display = "none";
}

function showError(text) { const box = $("api-error"); box.textContent = text; box.style.display = "block"; clearStates(); }

function tiles(box, label, summary, order = ORDER) {
  box.replaceChildren();
  const row = el("div", { class: "tilerow" }, el("span", { class: "tilerow-label" }, label));
  for (const key of ["total", ...order]) {
    row.append(el("div", { class: "tile" }, el("b", {}, String(summary[key])), key === "total" ? TEXT.tiles.total : TEXT.states[key]));
  }
  box.append(row);
}

function render(data, httpStatus) {
  if (data.api_error) { showError(TEXT.apiNotReady + data.api_error.code + (data.api_error.detail ? ": " + data.api_error.detail : "")); return; }
  $("api-error").style.display = "none";
  const status = oiStatus(data);

  tiles($("summary"), TEXT.rows.candles, data.summary);
  const interest = data.open_interest;
  if (interest && interest.summary) tiles($("oi-summary"), TEXT.rows.openInterest, interest.summary); else $("oi-summary").replaceChildren();
  $("oi-notice").textContent = oiNotice(status, interest ? interest.detail : "") || "";
  const fstatus = fundingStatus(data);
  const funding = data.funding_rate;
  if (funding && funding.summary) tiles($("funding-summary"), TEXT.rows.funding, funding.summary, FUNDING_ORDER); else $("funding-summary").replaceChildren();
  $("funding-health").textContent = funding && funding.health ? TEXT.fundingHealth(funding.health) : "";
  $("funding-notice").textContent = fundingNotice(fstatus, funding ? funding.detail : "", funding) || "";
  const notices = $("refresh-notice"); notices.replaceChildren();
  for (const line of refreshNotices(data.refresh || {})) notices.append(el("p", { class: "notice" }, line));

  const symbols = data.symbols;
  const problems = problemSymbols(symbols, status, fstatus);
  const table = $("problems"); table.replaceChildren();
  if (problems.length === 0) {
    table.append(el("tr", {}, el("td", { class: "muted" }, TEXT.noProblems)));
  } else {
    table.append(el("tr", {}, el("th", {}, TEXT.columns.candles), el("th", {}, TEXT.columns.openInterest), el("th", {}, TEXT.columns.funding),
      el("th", {}, TEXT.columns.symbol), el("th", {}, TEXT.columns.why)));
    for (const s of problems) {
      const state = oiStateOf(s, status);
      const fund = fundingStateOf(s, fstatus);
      table.append(el("tr", {}, el("td", {}, tag(s.state)), el("td", {}, state === null ? TEXT.notApplicable : tag(state)),
        el("td", {}, fund === null ? TEXT.notApplicable : tag(fund)),
        el("td", {}, s.symbol), el("td", {}, reasonLines(s, status, fstatus, funding).join("; "))));
    }
  }

  const ok = okEntries(symbols, status, fstatus);
  const group = $("ok-group"); group.replaceChildren();
  group.style.display = ok.length ? "block" : "none";
  if (ok.length) {
    const names = el("div", { class: "muted" });
    ok.forEach((entry, i) => {
      names.append((i ? ", " : "") + entry.symbol);
      if (entry.note) names.append(el("span", { class: "note" }, ` (${entry.note})`));
    });
    group.append(el("summary", {}, TEXT.okGroup(ok.length, okGroupLabel(status, fstatus))), names);
  }

  const heat = $("heatmap"); heat.replaceChildren();
  heat.append(el("tr", {}, el("th", {}, TEXT.columns.candles), el("th", {}, TEXT.columns.openInterest), el("th", {}, TEXT.columns.funding), el("th", {}, TEXT.columns.symbol),
    el("th", {}, TEXT.columns.since), el("th", {}, TEXT.columns.strips)));
  for (const s of symbols) {
    const state = oiStateOf(s, status);
    const block = s.open_interest;
    const candleCanvas = el("canvas");
    drawStrip(candleCanvas, s.strip, data.window, TEXT.strip);
    const cell = el("td", { style: "width:60%" }, el("div", { class: "strip-label" }, TEXT.rows.candles), candleCanvas);
    const since = el("td", {}, el("div", {}, `${TEXT.since.candles}: ${day(s.oldest_open_time_ms)}`));
    if (state !== null) {
      const interestCanvas = el("canvas");
      drawStrip(interestCanvas, block ? block.strip : null, data.window, TEXT.oiStrip);
      cell.append(el("div", { class: "strip-label" }, TEXT.rows.openInterest), interestCanvas);
      since.append(el("div", {}, `${TEXT.since.openInterest}: ${day(block ? block.oldest_time_ms : null)}`));
    }
    const fund = fundingStateOf(s, fstatus);
    if (fund !== null) cell.append(el("div", { class: "strip-label", title: TEXT.noStripFunding }, fundingLine(s.funding_rate, funding)));
    heat.append(el("tr", {}, el("td", {}, tag(s.state)), el("td", {}, state === null ? TEXT.notApplicable : tag(state)),
      el("td", {}, fund === null ? TEXT.notApplicable : tag(fund)), el("td", {}, s.symbol), since, cell));
  }
}

let inFlight = false, timer = null, lastFetchedAt = null, lastApiClock = null;

function updateAge() {
  const line = $("status-line");
  if (lastFetchedAt == null) { line.textContent = ""; return; }
  const seconds = Math.round((Date.now() - lastFetchedAt) / 1000);  // the browser's clock: display only, never a state
  line.textContent = `${fmt(lastApiClock)} · ${TEXT.age(seconds)}`;
  line.classList.toggle("old", seconds > OLD_AFTER_S);
}

async function refresh() {
  if (inFlight) return;
  inFlight = true; $("refresh").disabled = true;
  try {
    const response = await fetch("/overview.json", { cache: "no-store" });
    const data = await response.json();
    render(data, response.status);
    lastFetchedAt = Date.now(); lastApiClock = data.generated_at_ms ?? null;
  } catch (error) {
    lastFetchedAt = null;
    showError(TEXT.down + String(error));  // never leave an old green screen standing
  } finally {
    inFlight = false; $("refresh").disabled = false;
    clearTimeout(timer); timer = setTimeout(refresh, POLL_MS);  // the next poll starts after this one ended
    updateAge();
  }
}

$("refresh").addEventListener("click", refresh);
setInterval(updateAge, 1000);
legend();
refresh();
</script>
</body>
</html>
